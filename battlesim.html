<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Taistelu Simulaattori</title>

<style>
body { 
  margin:0; 
  background:#222; 
  color:white; 
  font-family:sans-serif; 
  overflow:hidden; 
}

canvas { 
  display:block; 
  margin:0 auto; 
  background:#2e7d32; 
}

#ui { 
  text-align:center; 
  padding:10px; 
}

#bar {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  background:#111;
  border-top:1px solid #444;
}

.card {
  width:130px;
  padding:10px;
  background:#444;
  border:1px solid white;
  cursor:grab;
  user-select:none;
  text-align:center;
}

#loseScreen {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
}

#startScreen {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.9);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
}

#startScreen {
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("battlesim.png") center/cover no-repeat;
}

.card { display:none; }

button {
  padding:8px;
  background:#333;
  color:white;
  border:1px solid #666;
  cursor:pointer;
}

.active-category {
  background: #00bcd4 !important;
  border: 2px solid white;
}
  
  .start-btn{
    background-color: #57554f;
    border: 1px solid #ccc;
    transition: all 0.3s ease;
  }

  .start-btn:hover {
    background-color: #57554f; 
    transform: scale(1.1); 
  }
  
.valikko:hover{
    background-color: #57554f; 
    transform: scale(1.1); 
}
  

</style>
</head>

<body>

<div id="startScreen">
  <h1>Taistelu Simulaattori</h1>
  
  <a href="https://nickname370.github.io/AloitusTest11/valikko3.html">
    <button class="valikko" style="transition: all 0.3s ease; position:absolute; top:550px; right:530px; padding:10px 14px; font-size:16px; cursor:pointer;">⬅️ Takaisin Pelivalikkoon</button>
  </a>
  
  <button class="start-btn" onclick="startMenu()">Aloita Peli</button>
	
</div>

<div id="loseScreen" style="display:none;">
  <h1>HÄVISIT!</h1>
  <button onclick="restartLevel()">Yritä uudelleen</button>
</div>

<div id="ui">
  <button onclick="backToMenu()">🏠 Takaisin aloitukseen</button>
  <button onclick="startGame()">Aloita taistelu</button>
  <p>Valitse joukot ja raahaa ne taistelukentälle.</p>
  <div id="money">Rahat: 200</div>
  <div id="info"></div>
</div>

<div id="bar">

  <div style="position:fixed; bottom:90px; left:0; width:100%; display:flex; justify-content:center; gap:1px;">
    <button onclick="showCategory('melee')">⚔️ Lähitaistelu</button>
    <button onclick="showCategory('ranged')">🏹 Ampuvat</button>
    <button onclick="showCategory('special')">🟫 Sekalaiset</button>
    <button onclick="showCategory('vehicles')">🐎 Ajoneuvot</button>
	<button onclick="showCategory('throwers')">🟣 Heittäjät</button>
  </div>

<div id="cards">

	<div class="card melee" draggable="true" ondragstart="drag(event)" data-type="sword" data-cost="50">
	⚔️ Miekkamies (50)
	</div>

	<div class="card ranged" draggable="true" ondragstart="drag(event)" data-type="archer" data-cost="40">
	🏹 Jousimies (40)
	</div>

	<div class="card special" draggable="true" ondragstart="drag(event)" data-type="caseoh" data-cost="150">
	🟫 CaseOh 
	<br>
	(150)
	</div>

	<div class="card vehicles" draggable="true" ondragstart="drag(event)" data-type="rider" data-cost="100">
	🐎 Ratsumies (100)
	</div>
	
	<div class="card melee" draggable="true" ondragstart="drag(event)" data-type="hobbit" data-cost="20">
	🧝 Hobitti 
	<br>
	(20)
	</div>
	
	<div class="card vehicles" draggable="true" ondragstart="drag(event)" data-type="tank" data-cost="300">
	💀 Tankki 
	<br>
	(300)
	</div>
	
	<div class="card special" draggable="true" ondragstart="drag(event)" data-type="ishowspeed" data-cost="120">
	🔥 IShowSpeed (120)
	</div>
	
	<div class="card ranged" draggable="true" ondragstart="drag(event)" data-type="gunner" data-cost="80">
	🔫 Muskettimies (80)
	</div>
	
	<div class="card throwers" draggable="true" ondragstart="drag(event)" data-type="thrower" data-cost="90">
	💣 Räjäyttäjä (90)
	</div>

  </div>

</div>

<canvas id="game" width="800" height="500"></canvas>

<script>

const caseOhImg = new Image();
caseOhImg.src = "caseoh.png";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const MID = 400;

const speedImg = new Image();
speedImg.src = "speed.png";



const levels = [
  { money: 250, swords: 3, archers: 1, caseoh: 0, rider: 0, thrower: 0, ishowspeed: 0, gunner: 0, hobbit: 0, tank: 0 },
  { money: 370, swords: 5, archers: 2, caseoh: 0, rider: 0, thrower: 0, ishowspeed: 0, gunner: 0, hobbit: 0, tank: 0 },
  { money: 470, swords: 9, archers: 4, caseoh: 0, rider: 0, thrower: 0, ishowspeed: 0, gunner: 0, hobbit: 2, tank: 0 },
  { money: 570, swords: 14, archers: 6, caseoh: 0, rider: 1, thrower: 0, ishowspeed: 0, gunner: 1, hobbit: 2, tank: 1 },
  { money: 1700, swords: 20, archers: 8, caseoh: 0, rider: 2, thrower: 0, ishowspeed: 1, gunner: 2, hobbit: 2, tank: 2 },
  { money: 2700, swords: 30, archers: 12, caseoh: 1, rider: 3, thrower: 1, ishowspeed: 2, gunner: 2, hobbit: 6, tank: 3 },
  { money: 6000, swords: 60, archers: 24, caseoh: 2, rider: 6, thrower: 2, ishowspeed: 4, gunner: 4, hobbit: 12, tank: 6 }
];

let units = [];
let arrows = [];
let shells = []; 
let level = 0;
let battleStarted = false;
let gameStarted = false;
let money = 0;

let draggedType = null;
let draggedCost = 0;

let shake = 0;
let quakeFlash = 0;

let activeCategory = "melee";

function showCategory(type){
  activeCategory = type;

  document.querySelectorAll('.card').forEach(c => c.style.display='none');
  document.querySelectorAll('.'+type).forEach(c => c.style.display='block');

  document.querySelectorAll('#bar button').forEach(b => {
    b.classList.remove('active-category');
    if(b.getAttribute("onclick")?.includes(type)){
      b.classList.add('active-category');
    }
  });
}

  event?.target?.classList?.add('active-category');


// ---------------- UI ----------------
function startMenu(){
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("cards").style.display = "flex";

  gameStarted = true;
  loadLevel(0);
  showCategory('melee');
}

function startGame(){
  battleStarted = true;
}

function restartLevel(){
  document.getElementById("loseScreen").style.display = "none";
  loadLevel(level);
}

function updateMoney(){
  document.getElementById("money").innerText = "Rahat: " + money;
}

function backToMenu(){
  battleStarted = false;
  gameStarted = false;

  // näytä start screen
  document.getElementById("startScreen").style.display = "flex";

  // piilota muut UI:t
  document.getElementById("cards").style.display = "none";

  // resetoi peli
  units = [];
  arrows = [];
  level = 0;
  money = 0;

  updateMoney();
}

// ---------------- DRAG ----------------
canvas.addEventListener("dragover", e => e.preventDefault());

canvas.addEventListener("drop", e => {
  if(battleStarted) return;
  if(money < draggedCost) return;

  const rect = canvas.getBoundingClientRect();
  let x = e.clientX - rect.left;
  let y = e.clientY - rect.top;

  if(x > MID) x = MID - 10;

  units.push(createUnit(draggedType, x, y, "blue"));
  money -= draggedCost;
  updateMoney();
});

function drag(ev){
  const type = ev.target.dataset.type;

  draggedType = type;
  draggedCost = parseInt(ev.target.dataset.cost);
}

// ---------------- UNITS ----------------
function createUnit(type, x, y, team){

  if(type === "caseoh"){
    return { type, x, y, hp:450, team, reload:0, size:30 };
  }

  if(type === "sword"){
    return { type, x, y, hp:100, team, reload:0, size:10 };
  }

  if(type === "archer"){
    return { type, x, y, hp:80, team, reload:0, size:10 };
  }

  if(type === "rider"){
    return { type, x, y, hp:150, team, reload:0, size:12 };
  }

  if(type === "hobbit"){
    return { type, x, y, hp:50, team, reload:0, size:4 };
  }

  if(type === "tank"){
    return { type, x, y, hp:500, team, reload:0, size:20 };
  }
  
  if(type === "ishowspeed"){
    return { type, x, y, hp:120, team, reload:0, size:14 };
  }
  
  if(type === "gunner"){
  return { type, x, y, hp:90, team, reload:0, size:11 };
  }

  if(type === "thrower"){
  return { type, x, y, hp:85, team, reload:0, size:11 };
  }

  // 🔴 TÄRKEÄ: fallback ettei palaudu undefined
  return { type, x, y, hp:100, team, reload:0, size:10 };
}
// ---------------- LEVEL ----------------
function loadLevel(i){
  level = i;
  units = [];
  arrows = [];
  battleStarted = false;
  shake = 0;
  quakeFlash = 0;

  const cfg = levels[level] || levels[levels.length-1];
  money = cfg.money;

  for(let i=0;i<cfg.swords;i++)
    units.push(createUnit("sword", 650+Math.random()*100, Math.random()*400, "red"));

  for(let i=0;i<cfg.archers;i++)
    units.push(createUnit("archer", 650+Math.random()*100, Math.random()*400, "red"));

  for(let i=0;i<cfg.caseoh;i++)
    units.push(createUnit("caseoh", 650+Math.random()*100, Math.random()*400, "red"));

  for(let i=0;i<cfg.rider;i++)
    units.push(createUnit("rider", 650+Math.random()*100, Math.random()*400, "red"));

  for(let i=0;i<(level>3?1:0);i++)
    units.push(createUnit("tank", 650+Math.random()*100, Math.random()*400, "red"));

  for(let i=0;i<(level>3?1:0);i++)
    units.push(createUnit("hobbit", 650+Math.random()*100, Math.random()*400, "red"));
	
  for(let i=0;i<(level>3?1:0);i++)
    units.push(createUnit("ishowspeed", 650+Math.random()*100, Math.random()*400, "red"));
	
  for(let i=0;i<(level>3?1:0);i++)
    units.push(createUnit("thrower", 650+Math.random()*100, Math.random()*400, "red"));

  updateMoney();
}

// ---------------- ARROWS ----------------
function spawnArrow(u, enemy){
  let dx = enemy.x - u.x;
  let dy = enemy.y - u.y;
  let dist = Math.hypot(dx,dy);

  arrows.push({
    x:u.x,
    y:u.y,
    vx:dx/dist*5,
    vy:dy/dist*5,
    team:u.team,
    damage:14
  });
}

// ---------------- BULLETS ----------------
function spawnBullet(u, enemy){
  let dx = enemy.x - u.x;
  let dy = enemy.y - u.y;
  let dist = Math.hypot(dx,dy);

  arrows.push({
    x:u.x,
    y:u.y,
    vx:dx/dist*7,
    vy:dy/dist*7,
    team:u.team,
    damage:25
  });
}

// ---------------- GRENADES ----------------
function spawnGrenade(u, enemy){
  let dx = enemy.x - u.x;
  let dy = enemy.y - u.y;
  let dist = Math.hypot(dx, dy);

  shells.push({
    type: "grenade",
    x: u.x,
    y: u.y,
    vx: dx / dist * 3,
    vy: dy / dist * 3,
    damage: 0,      // ei suoraa osumaa
    team: u.team,
    hit: false,
    exploded: false
  });
}

function explodeGrenade(g){
  const radius = 70;

  units.forEach(u => {
    if(u.team !== g.team){
      let d = Math.hypot(u.x - g.x, u.y - g.y);

      if(d < radius){
        u.hp -= 35 * (1 - d / radius); // mitä lähempänä, sitä enemmän damagea
      }
    }
  });
}
// ---------------- EARTHQUAKE ----------------
function earthquake(x,y){
  shake = 20;
  quakeFlash = 15;

  units.forEach(u => {
    let d = Math.hypot(u.x-x,u.y-y);
    if(d < 80) u.hp -= 25;
  });
}

// ---------------- UPDATE ----------------
function update(){
  if(!battleStarted) return;

  units.forEach(u => {
    if(u.hp <= 0) return;

    let enemies = units.filter(e => e.team !== u.team && e.hp > 0);
    if(enemies.length === 0) return;

    let enemy = enemies.reduce((closest, e) => {
      let d = Math.hypot(e.x - u.x, e.y - u.y);
      let cd = Math.hypot(closest.x - u.x, closest.y - u.y);
      return d < cd ? e : closest;
    }, enemies[0]);

    let dx = enemy.x - u.x;
    let dy = enemy.y - u.y;
    let dist = Math.hypot(dx, dy);
    if(dist === 0) return;

    // ---- SWORD ----
    if(u.type === "sword"){
      if(dist > 20){
        u.x += dx/dist;
        u.y += dy/dist;
      } else {
        enemy.hp -= 0.6;
      }
    }

    // ---- ARCHER ----
    if(u.type === "archer"){
      if(dist > 160){
        u.x += dx/dist * 0.7;
        u.y += dy/dist * 0.7;
      } else if(u.reload <= 0){
        spawnArrow(u, enemy);
        u.reload = 60;
      }
      u.reload--;
    }

    // ---- GUNNER ----
    if(u.type === "gunner"){
      if(dist > 220){
        u.x += dx/dist * 0.4;
        u.y += dy/dist * 0.4;
      } else if(u.reload <= 0){
        spawnBullet(u, enemy);
        u.reload = 90;
      }
      u.reload--;
    }

    // ---- RIDER ----
    if(u.type === "rider"){
      if(dist > 25){
        u.x += dx/dist * 1.8;
        u.y += dy/dist * 1.8;
      } else {
        enemy.hp -= 1;
      }
    }

    // ---- THROWER ----
    if(u.type === "thrower"){
      if(dist < 200 && u.reload <= 0){
        spawnGrenade(u, enemy);
        u.reload = 80;
      }
      u.reload--;
    }
	

    // ---- TANK ----
    if(u.type === "tank"){

      if(dist > 40){
        u.x += dx / dist * 0.4;
        u.y += dy / dist * 0.4;
      }

      if(dist < 25){
        enemy.hp -= 10;
      }

      if(u.reload <= 0 && dist < 300){
        shells.push({
          x:u.x,
          y:u.y,
          vx:dx/dist*3,
          vy:dy/dist*3,
          damage:60,
          team:u.team,
          hit:false
        });
        u.reload = 60;
      }

      u.reload--;
    }

    // ---- HOBBIT ----
    if(u.type === "hobbit"){
      if(dist > 15){
        u.x += dx/dist * 1.6;
        u.y += dy/dist * 1.6;
      } else {
        enemy.hp -= 1.4;
      }
    }

    // ---- SPEED ----
    if(u.type === "ishowspeed"){
      u.x += dx / dist * 3.5;
      u.y += dy / dist * 3.5;

      if(dist < 25){
        enemy.hp -= 2.5;
      }

      u.reload--;
    }

    // ---- CASEOH ----
    if(u.type === "caseoh"){
      if(dist < 50){
        earthquake(u.x, u.y);
        u.reload = 120;
      }

      u.x += dx/dist * 0.3;
      u.y += dy/dist * 0.3;
      u.reload--;
    }
  });

  // ---- ARROWS ----
  arrows.forEach(a => {
    a.x += a.vx;
    a.y += a.vy;

    units.forEach(u => {
      if(u.team !== a.team && Math.hypot(u.x-a.x, u.y-a.y) < 6){
        u.hp -= a.damage;
        a.hit = true;
      }
    });
  });

  arrows = arrows.filter(a => !a.hit);

  // ---- SHELLS ----
  shells.forEach(s => {
    s.x += s.vx;
    s.y += s.vy;

    units.forEach(u => {
      if(u.team !== s.team && Math.hypot(u.x - s.x, u.y - s.y) < 10){
        u.hp -= s.damage;
        s.hit = true;
      }
    });
  });

  shells = shells.filter(s => !s.hit);

  // ---- CLEANUP (AINOASTAAN KERRAN) ----
  units = units.filter(u => u.hp > 0);

  let reds = units.filter(u => u.team === "red");
  let blues = units.filter(u => u.team === "blue");

  if(reds.length === 0) loadLevel(level + 1);

  if(blues.length === 0){
    document.getElementById("loseScreen").style.display = "flex";
    battleStarted = false;
  }

  document.getElementById("info").innerText = "Level: " + (level + 1);



shells.forEach(s => {
  s.x += s.vx;
  s.y += s.vy;

  units.forEach(u => {
    if(u.team !== s.team && Math.hypot(u.x - s.x, u.y - s.y) < 10){
      u.hp -= s.damage;
      s.hit = true;
    }
  });
});

shells = shells.filter(s => !s.hit);
}

function drawTeamCircle(u, fillColor, image = null) {
  const r = u.size;

  // 🟦 reuna = tiimin väri
  ctx.beginPath();
  ctx.arc(u.x, u.y, r + 3, 0, Math.PI * 2);
  ctx.strokeStyle = (u.team === "red") ? "red" : "cyan";
  ctx.lineWidth = 3;
  ctx.stroke();

  // sisus
  ctx.beginPath();
  ctx.arc(u.x, u.y, r, 0, Math.PI * 2);
  ctx.fillStyle = fillColor;
  ctx.fill();

  // kuva (jos on)
  if (image && image.complete) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(u.x, u.y, r, 0, Math.PI * 2);
    ctx.clip();

    ctx.drawImage(image, u.x - r, u.y - r, r * 2, r * 2);
    ctx.restore();
  }
}

// ---------------- DRAW ----------------
function draw(){
  ctx.save();

  if(shake>0){
    ctx.translate(Math.random()*shake - shake/2, Math.random()*shake - shake/2);
    shake--;
  }

  ctx.fillStyle = quakeFlash>0 ? "#6d4c41" : "#2e7d32";
  if(quakeFlash>0) quakeFlash--;

  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="rgba(0,0,255,0.1)";
  ctx.fillRect(0,0,MID,500);

  ctx.fillStyle="rgba(255,0,0,0.1)";
  ctx.fillRect(MID,0,400,500);

units.forEach(u => {

if (u.type === "caseoh") {
  drawTeamCircle(u, "purple", caseOhImg);
  return;
}

  // ---- RIDER ----
if (u.type === "rider") {
  drawTeamCircle(u, "orange");
  return;
}

  // ---- SPEED ----
if (u.type === "ishowspeed") {
  drawTeamCircle(u, "yellow", speedImg);
  return;
}


  // ---- DEFAULT UNIT ----
  ctx.fillStyle = u.team === "red" ? "red" : "cyan";
  ctx.beginPath();
  ctx.arc(u.x, u.y, u.size, 0, Math.PI * 2);
  ctx.fill();
});
  ctx.fillStyle="yellow";
  arrows.forEach(a=>{
    ctx.beginPath();
    ctx.arc(a.x,a.y,3,0,Math.PI*2);
    ctx.fill();
  });

  ctx.fillStyle = "orange";
  shells.forEach(s=>{
    ctx.beginPath();
    ctx.arc(s.x, s.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.restore(); // ✅ tärkeä

} // ✅ TÄRKEIN: draw-funktion sulku

// ---------------- CATEGORY ----------------
function showCategory(type){
  document.querySelectorAll('.card').forEach(c => c.style.display='none');
  document.querySelectorAll('.'+type).forEach(c => c.style.display='block');
}

showCategory('melee');

// ---------------- LOOP ----------------
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

updateMoney();
loop();

</script>

</body>
</html>
