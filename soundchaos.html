<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Ääni Kaaos</title>

<style>
body {
    margin: 0;
    background: #0b1220;
    color: white;
    font-family: Arial;
    text-align: center;
}

h1 {
    margin-top: 15px;
    color: #38bdf8;
}

#panel {
    margin-top: 20px;
}

button {
    padding: 12px 16px;
    margin: 6px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    color:white;
}

.rain { background:#38bdf8; }
.pipe { background:#94a3b8; }
.fall { background:#fbbf24; }
.wind { background:#a78bfa; }
.stop { background:#ef4444; }

#info {
    margin-top: 15px;
    color: #94a3b8;
}
</style>
</head>

<body>

<a href="Salainen.html">
<button style="position:absolute; top:20px; right:20px;">
⬅️ Takaisin
</button>
</a>

<h1>🔊 ÄÄNI KAOS</h1>

<p>Soita useita ääniä yhtä aikaa!</p>

<div id="panel">

<button class="rain" onclick="playSound('rain')">
🌧️ Sade
</button>

<button class="pipe" onclick="playSound('pipe')">
🔧 Metalli
</button>

<button class="fall" onclick="playSound('fall')">
📦 Putoaminen
</button>

<button class="wind" onclick="playSound('wind')">
🌪️ Tuuli
</button>

<button class="stop" onclick="stopAll()">
⛔ STOP
</button>

</div>

<div id="info">
Kaikki äänet ovat nyt erilaisia
</div>

<script>

const ctx = new (window.AudioContext || window.webkitAudioContext)();

let activeSounds = [];

function playSound(type) {

    if (type === "rain") rainSound();
    if (type === "pipe") metalSound();
    if (type === "fall") fallSound();
    if (type === "wind") windSound();
}

function rainSound() {

    const bufferSize = 2 * ctx.sampleRate;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.15;
    }

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;

    const filter = ctx.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 4000;

    const gain = ctx.createGain();
    gain.gain.value = 0.25;

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    noise.start();

    activeSounds.push(noise);
}

function metalSound() {

    const osc = ctx.createOscillator();
    osc.type = "square";
    osc.frequency.value = 120;

    const gain = ctx.createGain();
    gain.gain.value = 0.15;

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();

    const interval = setInterval(() => {
        osc.frequency.value =
            80 + Math.random() * 200;
    }, 100);

    activeSounds.push({
        stop: () => {
            osc.stop();
            clearInterval(interval);
        }
    });
}

function fallSound() {

    const osc = ctx.createOscillator();
    osc.type = "sawtooth";

    const gain = ctx.createGain();

    osc.frequency.setValueAtTime(400, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(
        40,
        ctx.currentTime + 1
    );

    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 1
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 1);

    activeSounds.push(osc);
}

function windSound() {

    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.value = 120;

    const gain = ctx.createGain();
    gain.gain.value = 0.2;

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();

    const interval = setInterval(() => {
        osc.frequency.value =
            80 + Math.sin(Date.now()/300) * 40;
    }, 50);

    activeSounds.push({
        stop: () => {
            osc.stop();
            clearInterval(interval);
        }
    });
}

function stopAll() {

    activeSounds.forEach(s => {
        try {
            s.stop();
        } catch(e){}
    });

    activeSounds = [];
}

</script>

</body>
</html>
