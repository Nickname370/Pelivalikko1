<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Avaruusampuja</title>
<style>
body { margin:0; background:#000; color:white; text-align:center; font-family:Arial; }
canvas { background:#111; display:block; margin:auto; }
button { margin:10px; padding:8px 12px; }
</style>
</head>
<body>

<a href="https://nickname370.github.io/AloitusTest11/valikko3.html">
  <button style="position:absolute; top:20px; right:20px; padding:10px 14px; font-size:16px; cursor:pointer;">⬅️ Takaisin</button>
</a>

<h1>🚀 Avaruusampuja</h1>
<p>Hiiren pitää olla pelialueen (Hieman vaaleampi alue jossa pelaaja ja viholliset ovat) sisällä muuten se ei ammu!</p>
<p>WASD / Nuolet = liiku | Hiiren Vasen = ammu | P = pause | H = hard mode</p>
<p>Pisteet: <span id="score">0</span> | 🏆 Highscore: <span id="highscore">0</span></p>

<canvas id="game" width="600" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = {};
let gameRunning = true;
let paused = false;
let hardMode = false;

// 🔥 CHEAT CODE
let cheatCode = "";

// 🔫 cooldown
let lastShot = 0;
let shootDelay = 0;

// 🏆 Highscore
let highscore = localStorage.getItem("spaceHighscore") || 0;
document.getElementById("highscore").textContent = highscore;

// Näppäimet
document.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();
  keys[key] = true;

  // Pause
  if(key === "p"){
    paused = !paused;
  }

  // Hard mode
  if(key === "h"){
    hardMode = !hardMode;
    shootDelay = hardMode ? 300 : 0;
  }

  // 😈 CHEAT: kirjoita "hack"
  cheatCode += key;
  cheatCode = cheatCode.slice(-4);

  if(cheatCode === "hack"){
    score += 50;
    document.getElementById("score").textContent = score;
  }
});

document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

let player = {
  x: 300,
  y: 250,
  w: 30,
  h: 20,
  speed: 5
};

let bullets = [];
let enemies = [];
let score = 0;

const base = {
  x: 0,
  y: 0,
  w: 20,
  h: canvas.height
};

// Ammu
canvas.addEventListener("mousedown", e => {
  if(!gameRunning || paused) return;

  const now = Date.now();
  if(now - lastShot < shootDelay) return;

  if(e.button === 0){
    bullets.push({
      x: player.x + player.w,
      y: player.y + player.h/2 - 2,
      w: 10,
      h: 4,
      speed: 6
    });
    lastShot = now;
  }
});

// Spawn
function spawnEnemy(){
  if(!gameRunning || paused) return;

  enemies.push({
    x: canvas.width,
    y: Math.random() * (canvas.height - 40),
    w: 30,
    h: 20,
    speed: hardMode ? (2 + Math.random()*3) : (1 + Math.random()*2),
    dir: -1
  });
}

setInterval(spawnEnemy, 1000);

function update(){
  if(!gameRunning || paused) return;

  if(keys["a"] || keys["arrowleft"]) player.x -= player.speed;
  if(keys["d"] || keys["arrowright"]) player.x += player.speed;
  if(keys["w"] || keys["arrowup"]) player.y -= player.speed;
  if(keys["s"] || keys["arrowdown"]) player.y += player.speed;

  if(player.x < 0) player.x = 0;
  if(player.x + player.w > canvas.width) player.x = canvas.width - player.w;
  if(player.y < 0) player.y = 0;
  if(player.y + player.h > canvas.height) player.y = canvas.height - player.h;

  bullets.forEach(b => b.x += b.speed);
  enemies.forEach(e => e.x += e.speed * e.dir);

  // törmäykset
  bullets.forEach(b => {
    enemies.forEach(e => {
      if(b.x < e.x + e.w &&
         b.x + b.w > e.x &&
         b.y < e.y + e.h &&
         b.y + b.h > e.y){
        e.hit = true;
        b.hit = true;
        score++;
        document.getElementById("score").textContent = score;
      }
    });
  });

  // tukikohta
  enemies.forEach(e => {
    if(e.x <= base.w){
      e.hit = true;
      score--;
      if(score < 0) score = 0;
      document.getElementById("score").textContent = score;
    }
  });

  // game over
  enemies.forEach(e => {
    if(player.x < e.x + e.w &&
       player.x + player.w > e.x &&
       player.y < e.y + e.h &&
       player.y + player.h > e.y){

      gameRunning = false;

      // highscore
      if(score > highscore){
        localStorage.setItem("spaceHighscore", score);
      }

      setTimeout(() => {
        alert("Game Over! Pisteet: " + score);
        location.reload();
      }, 100);
    }
  });

  bullets = bullets.filter(b => !b.hit && b.x < canvas.width);
  enemies = enemies.filter(e => !e.hit && e.x > -50);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "blue";
  ctx.fillRect(base.x, base.y, base.w, base.h);

  ctx.fillStyle = "cyan";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  ctx.fillStyle = "yellow";
  bullets.forEach(b => ctx.fillRect(b.x,b.y,b.w,b.h));

  ctx.fillStyle = "red";
  enemies.forEach(e => ctx.fillRect(e.x,e.y,e.w,e.h));

  if(paused){
    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.fillText("PAUSE", canvas.width/2 - 70, canvas.height/2);
  }

  if(hardMode){
    ctx.fillStyle = "orange";
    ctx.font = "20px Arial";
    ctx.fillText("HARD MODE", canvas.width - 140, 30);
  }
}

function loop(){
  if(!gameRunning) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
