<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Väistelypeli</title>

<style>
body {
  margin: 0;
  background: #111;
  color: white;
  text-align: center;
  font-family: Arial;
}

canvas {
  background: #222;
  display: block;
  margin: auto;
}
</style>
</head>

<body>
<button onclick="restartGame()">🔄 Pelaa uudestaan</button>

<a href="https://nickname370.github.io/AloitusTest11/valikko3.html">
  <button style="position:absolute; top:20px; right:20px; padding:10px 14px; font-size:16px; cursor:pointer;">⬅️ Takaisin</button>
</a>

<h1>🎯 Väistelypeli</h1>
<p>Liiku A / D tai nuolinäppäimillä</p>
<p>
  Pisteet: <span id="score">0</span> |
  Ennätys: <span id="highscore">0</span>
</p>


<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = {};
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keydown", e => {
  cheatInput += e.key.toLowerCase();

  if(cheatInput.length > 10){
    cheatInput = cheatInput.slice(-10);
  }

  // 🎯 PISTE CHEAT
  if(cheatInput.includes("score")){
    score += 1000;
    document.getElementById("score").textContent = score;

    alert("💰 +100 pistettä!");
    cheatInput = "";

  }
});
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

let player = {
  x: 180,
  y: 550,
  w: 40,
  h: 20,
  speed: 5
};

let obstacles = [];
let score = 0;
let highscore = localStorage.getItem("highscore") || 0;
document.getElementById("highscore").textContent = highscore;
let gameOver = false;
let cheatInput = "";

// Luo este
function spawnObstacle(){
  obstacles.push({
    x: Math.random() * 360,
    y: -20,
    w: 40,
    h: 20,
    speed: 3 + Math.random()*2
  });
}

setInterval(spawnObstacle, 800);

function update(){
  if(gameOver) return;

  // liike
  if(keys["a"] || keys["arrowleft"]) player.x -= player.speed;
  if(keys["d"] || keys["arrowright"]) player.x += player.speed;

  // rajat
  if(player.x < 0) player.x = 0;
  if(player.x + player.w > canvas.width) player.x = canvas.width - player.w;

  // esteet
  obstacles.forEach(o => {
    o.y += o.speed;

    // törmäys
    if(!gameOver &&
       player.x < o.x + o.w &&
       player.x + player.w > o.x &&
       player.y < o.y + o.h &&
       player.y + player.h > o.y){

      // 🏆 ennätys
      if(score > highscore){
        highscore = score;
        localStorage.setItem("highscore", highscore);
        document.getElementById("highscore").textContent = highscore;
      }

      gameOver = true;

      setTimeout(() => {
        resetGame();
      }, 1000);
    }
  }); // 🔥 TÄMÄ PUUTTUI / OLI VÄÄRÄSSÄ KOHDASSA

  // poista ja pisteet
  obstacles = obstacles.filter(o => {
    if(o.y > canvas.height){
      score++;
      document.getElementById("score").textContent = score;
      return false;
    }
    return true;
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // pelaaja
  ctx.fillStyle = "cyan";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // esteet
  ctx.fillStyle = "red";
  obstacles.forEach(o=>{
    ctx.fillRect(o.x,o.y,o.w,o.h);
  });
}

function resetGame(){
  player.x = 180;
  player.y = 550;

  obstacles = [];
  score = 0;
  document.getElementById("score").textContent = score;

  gameOver = false; // 🔥 TÄRKEÄ
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

function restartGame(){
  resetGame();
}
</script>

</body>
</html>
