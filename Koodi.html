    let currentDictionary = languages.lang1;
    let reverseDictionary = {};
    let reverseMode = false;

    function buildReverse() {
      reverseDictionary = {};
      for (let key in currentDictionary) {
        reverseDictionary[currentDictionary[key]] = key;
      }
    }
function convertNormal(text) {
  const source = document.getElementById("languageSelect").value === "lang16"
    ? text
    : text.toUpperCase();

  return source.split("").map(c => currentDictionary[c] || c).join("");
}

    function convertReverse(text) {
      let result = "";
      let i = 0;

      const codes = Object.keys(reverseDictionary)
        .sort((a, b) => b.length - a.length);

      while (i < text.length) {
        let matched = false;

        for (let code of codes) {
          if (text.substring(i, i + code.length) === code) {
            result += reverseDictionary[code];
            i += code.length;
            matched = true;
            break;
          }
        }

        if (!matched) {
          result += text[i];
          i++;
        }
      }

      return result;
    }

    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const inputLabel = document.getElementById("inputLabel");
    const outputLabel = document.getElementById("outputLabel");

    input.addEventListener("input", update);

    function update() {
      if (!reverseMode) {
        output.value = convertNormal(input.value);
      } else {
        output.value = convertReverse(input.value);
      }
    }

    function toggleMode() {
      reverseMode = !reverseMode;
      input.value = "";
      output.value = "";

      if (reverseMode) {
        inputLabel.textContent = "Kirjoita valitulla kielellä";
        outputLabel.textContent = "Käännös normaaliin tekstiin";
      } else {
        inputLabel.textContent = "Kirjoita normaali teksti";
        outputLabel.textContent = "Käännös valittuun kieleen";
      }
    }

    function changeLanguage() {
      const selected = document.getElementById("languageSelect").value;
      currentDictionary = languages[selected];
      buildReverse();
      update();
    }

    buildReverse();
