<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Täysi Sanansekoittaja</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f4f8;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            resize: vertical;
        }

        textarea:focus {
            border-color: #3498db;
            outline: none;
        }

        button {
            display: block;
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #27ae60;
        }

        .tulos-alue {
            margin-top: 25px;
            padding: 15px;
            background-color: #ecf0f1;
            border-radius: 6px;
            border-left: 5px solid #3498db;
            min-height: 50px;
            white-space: pre-wrap; /* Säilyttää rivinvaihdot */
            font-size: 16px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Täysi Sanansekoittaja</h1>
    
    <label for="alkuperainen">Kirjoita teksti tähän:</label>
    <textarea id="alkuperainen" placeholder="Kirjoita jotain..."></textarea>
    
    <button onclick="sekoitaTeksti()">Sekoita kirjaimet!</button>
    
    <label>Sekoitettu lopputulos:</label>
    <div id="tulos" class="tulos-alue">Tulos ilmestyy tähän...</div>
	
<a href="sekoilu0.html" style="position: absolute; top: 10px; right: 20px; padding: 10px 14px; font-size: 16px; cursor: pointer; text-decoration: none; background-color: #f1f2f6; color: #333; border: 1px solid #ccc; border-radius: 4px; font-family: Arial, sans-serif;">
  ⬅️ Takaisin
</a>

</div>

<script>
    // Funktio, joka sekoittaa yksittäisen sanan kirjaimet
    function sekoitaSana(sana) {
        let kirjaimet = sana.split('');
        for (let i = kirjaimet.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            // Vaihdetaan kirjainten paikkaa keskenään
            let temp = kirjaimet[i];
            kirjaimet[i] = kirjaimet[j];
            kirjaimet[j] = temp;
        }
        return kirjaimet.join('');
    }

    // Pääfunktio, joka käsittelee koko tekstin
    function sekoitaTeksti() {
        const syote = document.getElementById('alkuperainen').value;
        
        // Erotetaan sanat toisistaan, mutta säilytetään välimerkit ja välilyönnit
        // Tämä säännöllinen lauseke (regex) tunnistaa pelkät kirjaimet erillisinä sanoina
        const sekoitettu = syote.replace(/[a-zA-ZåäöÅÄÖ]+/g, function(sana) {
            return sekoitaSana(sana);
        });

        // Tulostetaan valmis teksti sivulle
        document.getElementById('tulos').innerText = sekoitettu || "Kirjoita ensin jotain yllä olevaan kenttään.";
    }
</script>

</body>
</html>
